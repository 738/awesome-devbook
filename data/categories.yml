# 카테고리 정의. 순서가 곧 README 순서다.
# 책은 books.yml 에서 `category: <이름>` 또는 `category: <이름>/<하위>` 로 연결한다.

- group: 행동양식에 대한 서적
  description: "효율적으로 팀에서 일할 수 있게 안내하거나, 일반적인 상황에서 더 나은 프로페셔널이 될 수 있도록 조언한다."
  categories:
    - name: "애자일 방법론"
    - name: "소프트웨어 장인정신"
    - name: "행동양식 기타"
    - name: "커리어와 리더십"
- group: 특정 개념에 대한 서적
  description: "커리어를 진전시킬 때 필요한 기초를 쌓을 수 있는 책이다. 새로운 개념이나 패러다임 또는 실행 관례들을 소개한다. 당장 활용하기는 어렵고, 제대로 이해하고 습득하는 데 긴 시간이 필요할 때도 있다."
  categories:
    - name: "디자인 패턴"
    - name: "테스트 주도 개발"
    - name: "클린코드"
    - name: "객체지향"
    - name: "함수형 프로그래밍"
    - name: "도메인 주도 설계"
    - name: "소프트웨어 아키텍처"
- group: 특정 기술에 대한 서적
  description: "업무를 위해 어떤 프레임워크나 프로그래밍 언어 또는 특정 소프트웨어의 이용 방법을 급하게 알아야 할 때 꼭 필요하다. 당장의 업무에는 유용하지만 그 가치가 오래가지는 않는다. 기술 서적은 당면한 업무와 관련된 것들에 대해 상세하고 심도 있는 기술 지식을 제공한다. 커리어의 다음 단계를 계획하는 데도 큰 도움이 된다."
  categories:
    - name: "C"
    - name: "C++"
    - name: "Git"
    - name: "자바"
    - name: "코틀린"
    - name: "자바스크립트"
    - name: "타입스크립트"
    - name: "파이썬"
    - name: "Go"
    - name: "Rust"
    - name: "프론트엔드"
      subs: ["리액트", "뷰", "앵귤러", "웹 성능"]
    - name: "백엔드"
      subs: ["스프링", "Node.js", "HTTP"]
    - name: "데이터베이스"
    - name: "데브옵스"
    - name: "머신러닝"
    - name: "AI와 LLM"
    - name: "안드로이드"
    - name: "iOS"
- group: 컴퓨터과학
  categories:
    - name: "알고리즘"
    - name: "컴퓨터구조"
    - name: "운영체제"
    - name: "네트워크"
    - name: "보안"
- group: 개발 관련 기타 서적
  categories:
    - name: "인터뷰"
    - name: "글쓰기"
    - name: "영어"
