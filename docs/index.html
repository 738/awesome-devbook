<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Awesome Devbook · 국내 개발 도서 책장</title>
<meta name="description" content="국내에 출간된 개발 도서를 책장처럼 둘러보세요. 분야별 선반, 목적별 추천 경로, ISBN 기반 자동 점검.">
<meta property="og:title" content="Awesome Devbook · 국내 개발 도서 책장">
<meta property="og:description" content="국내에 출간된 개발 도서를 책장처럼 둘러보세요.">
<meta property="og:image" content="https://raw.githubusercontent.com/738/awesome-devbook/master/awesome-devbook.png">
<meta name="theme-color" content="#ece4d6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://image.aladin.co.kr">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 컨셉: 서재 벽. 분야마다 나무 선반 한 칸, 표지가 정면으로 서 있다. 책을 누르면 선반에서 꺼내 상세 시트로 펼친다. */
:root{
  --wall:#ece4d6; --wall-2:#e4dacb; --ink:#2a231d; --mute:#7a6f62; --line:#d7cbb8;
  --wood-hi:#c99a68; --wood:#a8794c; --wood-lo:#7b5534; --wood-edge:#5e3f26;
  --paper:#fbf8f2; --accent:#b8442f; --accent-ink:#fff; --chip:#e2d7c5; --sticker:#e8b737;
  --display:"Gowun Batang",Georgia,serif; --body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --bw:118px; --bh:172px;
}
@media (prefers-color-scheme:dark){:root{
  --wall:#1d1915; --wall-2:#231e19; --ink:#efe7db; --mute:#a59886; --line:#3a322a;
  --wood-hi:#6b4a30; --wood:#553923; --wood-lo:#3c2717; --wood-edge:#2a1a0e;
  --paper:#2a241e; --accent:#e06a52; --accent-ink:#1a1310; --chip:#332b23; --sticker:#d9a92a; color-scheme:dark}}
@media (max-width:640px){:root{--bw:92px;--bh:134px}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:15px/1.6 var(--body);word-break:keep-all;
  background:var(--wall) radial-gradient(1200px 600px at 20% -10%,color-mix(in srgb,#fff 35%,transparent),transparent 70%) no-repeat}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}

/* 머리 */
header.wrap{padding-block:44px 8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}
h1{font-family:var(--display);font-weight:700;font-size:clamp(32px,5.4vw,52px);line-height:1.1;margin:0;letter-spacing:-.015em}
h1 em{font-style:normal;color:var(--accent)}
.lead{margin:10px 0 0;color:var(--mute);max-width:52ch}
.stats{display:flex;gap:18px;font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px;flex-wrap:wrap}
.stats b{display:block;font-family:var(--display);font-size:26px;color:var(--ink);line-height:1.1}
@media (max-width:760px){header.wrap{grid-template-columns:1fr}}

/* 도구 막대 */
.bar{position:sticky;top:0;z-index:20;padding-block:10px;background:color-mix(in srgb,var(--wall) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 280px;min-width:0;position:relative}
.search input{width:100%;font:inherit;padding:11px 14px 11px 40px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;width:17px;height:17px;stroke:var(--mute)}
select{font:inherit;padding:10px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.tog{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mute);cursor:pointer;white-space:nowrap}
.jump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px;flex-basis:100%}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;text-decoration:none;font-size:13px;padding:5px 11px;border-radius:999px;background:var(--chip);color:var(--ink);white-space:nowrap}
.jump a:hover{background:var(--accent);color:var(--accent-ink)}

/* 추천 경로: 부채꼴로 겹친 표지 */
.tracks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-block:30px 10px}
.track{all:unset;cursor:pointer;display:grid;grid-template-rows:150px auto;gap:10px;padding:16px;border-radius:16px;background:var(--paper);border:1px solid var(--line);transition:border-color .2s,translate .2s}
.track:hover,.track:focus-visible{border-color:var(--accent);translate:0 -2px}
.fan{position:relative;height:150px}
.fan img,.fan .ph{position:absolute;bottom:0;left:50%;width:84px;height:122px;object-fit:cover;border-radius:2px 4px 4px 2px;
  box-shadow:0 6px 14px rgba(40,25,10,.28);transform-origin:50% 120%;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.track .t{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.3}
.track .d{color:var(--mute);font-size:13px;margin-top:2px}

/* 선반 */
.shelf{margin-top:34px;scroll-margin-top:120px}
.shelf-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.shelf-head h2{font-family:var(--display);font-size:22px;margin:0}
.shelf-head .n{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.shelf-head .grp{color:var(--mute);font-size:12px;letter-spacing:.06em}
.shelf-head .more{margin-left:auto;border:0;background:none;color:var(--mute);font-size:13px;cursor:pointer;padding:4px 6px;border-radius:6px}
.shelf-head .more:hover{color:var(--accent)}
.rack{position:relative}
.row{display:flex;gap:22px;align-items:flex-end;overflow-x:auto;overflow-y:visible;scroll-snap-type:x proximity;scrollbar-width:none;
  padding:26px 22px 0;min-height:calc(var(--bh) + 26px)}
.row::-webkit-scrollbar{display:none}
/* 나무 판: 윗면(밝음) + 앞면 + 그림자 */
.plank{height:22px;margin-top:-2px;border-radius:3px;position:relative;z-index:1;
  background:linear-gradient(to bottom,var(--wood-hi) 0 5px,var(--wood) 5px 15px,var(--wood-lo) 15px 20px,var(--wood-edge) 20px);
  box-shadow:0 14px 18px -10px rgba(40,25,10,.45)}
.plank::before{content:"";position:absolute;inset:0;border-radius:inherit;opacity:.18;
  background:repeating-linear-gradient(90deg,transparent 0 37px,rgba(0,0,0,.35) 37px 38px,transparent 38px 91px,rgba(255,255,255,.4) 91px 92px)}
/* 펼친 선반: 줄마다 나무 판이 반복된다 */
.rack.open .row{flex-wrap:wrap;overflow:visible;row-gap:48px;padding-bottom:48px;
  background:repeating-linear-gradient(to bottom,transparent 0 calc(var(--bh) + 26px),var(--wood-hi) 0 calc(var(--bh) + 31px),var(--wood) 0 calc(var(--bh) + 41px),var(--wood-lo) 0 calc(var(--bh) + 46px),var(--wood-edge) 0 calc(var(--bh) + 48px),transparent 0 calc(var(--bh) + 74px));
  background-position:0 0}
.rack.open .row{background-size:100% calc(var(--bh) + 74px)}
.rack.open .plank{display:none}
.nav-btn{position:absolute;top:calc(50% - 22px);z-index:3;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.12);opacity:0;transition:opacity .2s}
.nav-btn.l{left:-6px}.nav-btn.r{right:-6px}
.rack:hover .nav-btn.on{opacity:1}
.rack.open .nav-btn{display:none}
@media (hover:none){.nav-btn{display:none}}

/* 책 */
.book{flex:none;position:relative;width:var(--bw);height:var(--bh);border:0;padding:0;background:none;cursor:pointer;scroll-snap-align:start;perspective:700px}
.book .c{position:absolute;inset:0;border-radius:2px 4px 4px 2px;overflow:hidden;background:var(--chip);
  box-shadow:1px 0 0 rgba(255,255,255,.25) inset,0 2px 2px rgba(40,25,10,.25),0 10px 16px -6px rgba(40,25,10,.4);
  transform-origin:0 100%;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.book img{width:100%;height:100%;object-fit:cover;display:block}
/* 책등 접힘 음영 + 표지 광택 */
.book .c::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.28) 0,rgba(255,255,255,.22) 3px,rgba(0,0,0,.06) 7px,transparent 12px),linear-gradient(135deg,rgba(255,255,255,.18),transparent 45%)}
.book:hover .c,.book:focus-visible .c{transform:translateY(-10px) rotateY(-14deg);box-shadow:1px 0 0 rgba(255,255,255,.25) inset,0 4px 4px rgba(40,25,10,.2),14px 24px 26px -10px rgba(40,25,10,.45)}
.book .tip{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:18px 8px 7px;font-size:11.5px;line-height:1.35;color:#fff;text-align:left;
  background:linear-gradient(to top,rgba(20,14,8,.88),rgba(20,14,8,.6) 70%,transparent);opacity:0;pointer-events:none;transition:opacity .2s}
.book .tip b{display:block;font-size:12.5px;font-weight:700;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.book:hover .tip,.book:focus-visible .tip{opacity:1}
@media (hover:none){.book .tip{display:none}}
.sticker{position:absolute;top:-8px;right:-8px;z-index:2;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#3a2a05;background:var(--sticker);box-shadow:0 2px 4px rgba(0,0,0,.25);rotate:12deg}
.sash{position:absolute;left:0;right:0;bottom:12px;z-index:2;text-align:center;font-size:11px;font-weight:700;letter-spacing:.1em;
  color:#fff;background:rgba(40,30,25,.78);padding:2px 0}
.book.oop .c img{filter:grayscale(.55) contrast(.95)}
.ph{display:flex;flex-direction:column;justify-content:space-between;padding:10px 9px 10px 14px;text-align:left;color:#fff;font-family:var(--display);font-weight:700;font-size:13px;line-height:1.3}
.ph small{font-family:var(--body);font-weight:500;font-size:10px;opacity:.85}

.empty{padding:60px 0;text-align:center;color:var(--mute)}
footer{margin-top:60px;padding-block:28px 48px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}

/* 상세 시트 */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(20,14,8,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .3s}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:51;left:50%;top:50%;translate:-50% -50%;width:min(860px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;
  border-radius:22px;background:var(--paper);box-shadow:0 30px 80px rgba(0,0,0,.35);display:grid;grid-template-columns:300px minmax(0,1fr);opacity:0;scale:.97;transition:opacity .3s,scale .3s}
.sheet.on{opacity:1;scale:1}
.sheet .hero{position:relative;display:grid;place-items:center;padding:36px 28px;background:var(--tint,#8a6b4a);border-radius:22px 0 0 22px}
.sheet .hero::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(to bottom,rgba(255,255,255,.12),rgba(0,0,0,.18))}
.sheet .big{position:relative;z-index:1;width:200px;aspect-ratio:118/172;border-radius:3px 6px 6px 3px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.sheet .big img{width:100%;height:100%;object-fit:cover;display:block}
.sheet .big::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.3) 0,rgba(255,255,255,.25) 4px,transparent 14px)}
.sheet .info{padding:30px 30px 26px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sheet .cat{font-size:12px;letter-spacing:.06em;color:var(--mute)}
.sheet h3{font-family:var(--display);font-size:28px;line-height:1.25;margin:0;text-wrap:balance}
.sheet .sub{color:var(--mute);margin:-4px 0 0}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:4px 0}
.meta dt{color:var(--mute)}.meta dd{margin:0;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--chip)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:14px;padding:11px 18px;border-radius:999px;border:0;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.close{position:absolute;top:14px;right:14px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;background:color-mix(in srgb,var(--paper) 80%,transparent);display:grid;place-items:center;font-size:20px;line-height:1}
.neighbors h4{margin:10px 0 8px;font-size:13px;color:var(--mute);font-weight:500}
.neighbors .list{display:flex;gap:12px;overflow-x:auto;scrollbar-width:thin;padding:6px 2px 8px}
.neighbors .book{--bw:64px;--bh:93px}
.neighbors .book .sticker,.neighbors .book .tip{display:none}
.flyer{position:fixed;z-index:60;pointer-events:none;border-radius:3px 6px 6px 3px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.4);
  transition:left .42s cubic-bezier(.2,.8,.2,1),top .42s cubic-bezier(.2,.8,.2,1),width .42s cubic-bezier(.2,.8,.2,1),height .42s cubic-bezier(.2,.8,.2,1)}
.flyer img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:700px){
  .sheet{top:auto;bottom:0;left:0;translate:none;width:100%;max-height:92%;border-radius:22px 22px 0 0;grid-template-columns:1fr;scale:1;transform:translateY(30px);transition:opacity .3s,transform .3s}
  .sheet.on{transform:none}
  .sheet .hero{border-radius:22px 22px 0 0;padding:28px}
  .sheet .big{width:150px}
  .sheet .info{padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px))}
  .sheet h3{font-size:24px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .book .c,.fan img,.track,.sheet,.scrim,.flyer{transition:none!important}
  .book:hover .c{transform:none}
}
</style>
</head>
<body>
<header class="wrap">
  <div>
    <h1>Awesome <em>Devbook</em></h1>
    <p class="lead">국내에 출간된 개발 도서를 책장처럼 둘러보세요. 표지를 누르면 책을 꺼내 볼 수 있어요.</p>
  </div>
  <div class="stats" id="stats"></div>
</header>

<div class="bar"><div class="wrap">
  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="제목, 저자, 출판사로 찾기" aria-label="책 검색" autocomplete="off">
  </label>
  <select id="year" aria-label="출간연도">
    <option value="0">모든 연도</option><option value="2024">2024년 이후</option><option value="2020">2020년 이후</option><option value="2015">2015년 이후</option>
  </select>
  <label class="tog"><input type="checkbox" id="hideOop"> 절판 숨기기</label>
  <nav class="jump" id="jump" aria-label="분야로 이동"></nav>
</div></div>

<main class="wrap" id="main"><p class="empty">책장을 정리하는 중…</p></main>

<footer class="wrap">
  데이터 원본은 <a href="https://github.com/738/awesome-devbook/blob/master/data/books.yml">data/books.yml</a> 입니다. 책 추천은
  <a href="https://github.com/738/awesome-devbook/issues/new?template=book-request.yml">이슈</a>나 PR로 남겨 주세요.
  표지 이미지와 상품 정보는 <a href="https://www.aladin.co.kr">알라딘</a>에서 제공받아 연결합니다.
</footer>

<script>
(async () => {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const small = (u) => u && u.replace("/cover500/", "/cover200/");
  const thisYear = new Date().getFullYear();

  let data;
  try { data = await (await fetch("books.json", { cache: "no-store" })).json(); }
  catch { $("#main").innerHTML = '<p class="empty">책 목록을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.</p>'; return; }
  const { groups, tracks, books } = data;
  const byIsbn = new Map(books.map((b) => [b.isbn, b]));
  const top = (c) => c.split("/")[0];
  const cats = groups.flatMap((g) => g.categories.map((c) => ({ ...c, group: g.group })));
  const state = { q: "", year: 0, hideOop: false, track: null };

  $("#stats").innerHTML = `<span><b>${books.length}</b>권</span><span><b>${cats.length}</b>개 선반</span>` +
    `<span><b>${books.filter((b) => +b.published.slice(0, 4) >= thisYear - 2).length}</b>최근 3년</span>`;
  $("#jump").innerHTML = cats.map((c) => `<a href="#s-${encodeURIComponent(c.name)}">${esc(c.name)}</a>`).join("");

  // 표지가 없을 때: 제목으로 만든 천 장정 표지
  const hue = (s) => [...s].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) % 360, 7);
  const placeholder = (b) => `<div class="ph" style="background:linear-gradient(160deg,hsl(${hue(b.title)} 38% 42%),hsl(${hue(b.title)} 42% 28%))"><span>${esc(b.title)}</span><small>${esc(b.authors[0])}</small></div>`;
  const coverImg = (b, big) => b.cover ? `<img src="${esc(big ? b.cover : small(b.cover))}" alt="" loading="lazy" decoding="async" crossorigin="anonymous">` : placeholder(b);

  const bookEl = (b) => {
    const year = +b.published.slice(0, 4);
    const stick = !b.out_of_print && year >= thisYear - 1 ? '<span class="sticker">신간</span>' : "";
    const sash = b.out_of_print ? '<span class="sash">절판</span>' : "";
    return `<button class="book${b.out_of_print ? " oop" : ""}" data-isbn="${b.isbn}" aria-label="${esc(b.title)} — ${esc(b.authors.join(", "))}">` +
      `<span class="c">${coverImg(b)}${sash}<span class="tip"><b>${esc(b.title)}</b>${esc(b.authors[0])}${b.authors.length > 1 ? " 외" : ""} · ${year}</span></span>${stick}</button>`;
  };

  const shelf = (id, title, sub, list, open) => `<section class="shelf" id="${id}"><div class="shelf-head"><h2>${esc(title)}</h2><span class="n">${list.length}권</span>` +
    (sub ? `<span class="grp">${esc(sub)}</span>` : "") + `<button class="more" data-toggle>${open ? "선반 접기" : "모두 펼치기"}</button></div>` +
    `<div class="rack${open ? " open" : ""}"><button class="nav-btn l" aria-label="왼쪽으로">‹</button><div class="row">${list.map(bookEl).join("")}</div>` +
    `<button class="nav-btn r" aria-label="오른쪽으로">›</button><div class="plank"></div></div></section>`;

  const fanImgs = (list) => {
    const n = list.length;
    return list.map((b, i) => {
      const a = (i - (n - 1) / 2) * 9, x = (i - (n - 1) / 2) * 22;
      const inner = b.cover ? `<img src="${esc(small(b.cover))}" alt="" loading="lazy" style="--a:${a}deg;--x:${x}px;transform:translateX(calc(-50% + var(--x))) rotate(var(--a));z-index:${i}">`
        : `<div class="ph" style="width:84px;height:122px;transform:translateX(calc(-50% + ${x}px)) rotate(${a}deg);z-index:${i};background:hsl(${hue(b.title)} 38% 38%)"><span>${esc(b.title)}</span></div>`;
      return inner;
    }).join("");
  };

  function render() {
    const m = (b) => (!state.q || [b.title, b.subtitle, b.authors.join(" "), b.publisher, b.category].join(" ").toLowerCase().includes(state.q))
      && (!state.year || +b.published.slice(0, 4) >= state.year) && (!state.hideOop || !b.out_of_print);
    let html = "";
    if (state.track) {
      const t = state.track;
      html += `<p style="margin:26px 0 0"><button class="btn ghost" id="backAll">← 전체 책장으로</button></p>` +
        shelf("s-track", t.name, t.description, t.books.map((i) => byIsbn.get(String(i))), true);
    } else if (state.q || state.year || state.hideOop) {
      const list = books.filter(m);
      html += list.length ? shelf("s-result", "찾은 책", state.q ? `“${state.q}”` : "", list, true) : '<p class="empty">조건에 맞는 책이 없어요. 검색어나 필터를 바꿔 보세요.</p>';
    } else {
      html += `<div class="tracks">${tracks.map((t, i) => `<button class="track" data-track="${i}"><div class="fan">${fanImgs(t.books.map((x) => byIsbn.get(String(x))))}</div>` +
        `<div><div class="t">${esc(t.name)}</div><div class="d">${esc(t.description)}</div></div></button>`).join("")}</div>`;
      for (const c of cats) {
        const list = books.filter((b) => top(b.category) === c.name);
        if (list.length) html += shelf(`s-${encodeURIComponent(c.name)}`, c.name, c.group.replace(/에 대한 서적| 서적/g, ""), list, false);
      }
    }
    $("#main").innerHTML = html;
    document.querySelectorAll(".rack").forEach(updateNav);
  }

  // 부채꼴: 마우스를 올리면 펼친다
  document.addEventListener("pointerover", (e) => {
    const t = e.target.closest(".track"); if (!t || reduce) return;
    t.querySelectorAll(".fan img,.fan .ph").forEach((img, i, all) => {
      const n = all.length, k = i - (n - 1) / 2;
      img.style.transform = `translateX(calc(-50% + ${k * 46}px)) rotate(${k * 4}deg) translateY(${-Math.abs(k) * -4 - 6}px)`;
    });
  });
  document.addEventListener("pointerout", (e) => {
    const t = e.target.closest(".track"); if (!t || t.contains(e.relatedTarget)) return;
    t.querySelectorAll(".fan img,.fan .ph").forEach((img, i, all) => {
      const n = all.length, k = i - (n - 1) / 2;
      img.style.transform = `translateX(calc(-50% + ${k * 22}px)) rotate(${k * 9}deg)`;
    });
  });

  function updateNav(rack) {
    const row = $(".row", rack); if (!row) return;
    $(".nav-btn.l", rack).classList.toggle("on", row.scrollLeft > 4);
    $(".nav-btn.r", rack).classList.toggle("on", row.scrollLeft + row.clientWidth < row.scrollWidth - 4);
    // 한 칸에 다 들어가는 선반은 펼칠 필요가 없다
    const tg = rack.closest(".shelf")?.querySelector("[data-toggle]");
    if (tg && !rack.classList.contains("open")) tg.hidden = row.scrollWidth <= row.clientWidth + 4;
  }
  document.addEventListener("scroll", (e) => { if (e.target.classList?.contains("row")) updateNav(e.target.parentElement); }, true);
  addEventListener("resize", () => document.querySelectorAll(".rack").forEach(updateNav));

  document.addEventListener("click", (e) => {
    const nav = e.target.closest(".nav-btn");
    if (nav) { const row = $(".row", nav.parentElement); row.scrollBy({ left: (nav.classList.contains("l") ? -1 : 1) * row.clientWidth * 0.8, behavior: reduce ? "auto" : "smooth" }); return; }
    const tg = e.target.closest("[data-toggle]");
    if (tg) { const rack = $(".rack", tg.closest(".shelf")); const open = rack.classList.toggle("open"); tg.textContent = open ? "선반 접기" : "모두 펼치기"; updateNav(rack); return; }
    const tr = e.target.closest("[data-track]");
    if (tr) { state.track = tracks[+tr.dataset.track]; render(); scrollTo({ top: $("#main").offsetTop - 70 }); return; }
    if (e.target.closest("#backAll")) { state.track = null; render(); return; }
    const bk = e.target.closest(".book");
    if (bk) openBook(byIsbn.get(bk.dataset.isbn), bk);
  });

  $("#q").addEventListener("input", (e) => { state.q = e.target.value.trim().toLowerCase(); state.track = null; render(); });
  $("#year").addEventListener("change", (e) => { state.year = +e.target.value; state.track = null; render(); });
  $("#hideOop").addEventListener("change", (e) => { state.hideOop = e.target.checked; state.track = null; render(); });

  // ---------- 상세 시트 ----------
  const tintCache = new Map();
  function tintOf(img) {
    try {
      const c = document.createElement("canvas"); c.width = c.height = 12;
      const g = c.getContext("2d"); g.drawImage(img, 0, 0, 12, 12);
      const d = g.getImageData(0, 0, 12, 12).data; let r = 0, gg = 0, b = 0, n = 0;
      for (let i = 0; i < d.length; i += 4) { r += d[i]; gg += d[i + 1]; b += d[i + 2]; n++; }
      r /= n; gg /= n; b /= n;
      const k = 0.78; // 조금 어둡게 눌러 흰 글씨·표지가 떠 보이게
      return `rgb(${r * k | 0},${gg * k | 0},${b * k | 0})`;
    } catch { return null; }
  }
  let current = null, lastFocus = null;
  function openBook(b, fromEl) {
    if (!b) return;
    closeBook(true);
    lastFocus = fromEl || document.activeElement;
    const year = b.published.slice(0, 4);
    const neighbors = books.filter((x) => top(x.category) === top(b.category) && x.isbn !== b.isbn).slice(0, 12);
    const scrim = Object.assign(document.createElement("div"), { className: "scrim" });
    const sheet = Object.assign(document.createElement("div"), { className: "sheet" });
    sheet.setAttribute("role", "dialog"); sheet.setAttribute("aria-modal", "true"); sheet.setAttribute("aria-label", b.title);
    sheet.innerHTML = `<button class="close" aria-label="닫기">×</button>
      <div class="hero"><div class="big">${coverImg(b, true)}</div></div>
      <div class="info">
        <div class="cat">${esc(b.category.replace("/", " · "))}</div>
        <h3>${esc(b.title)}</h3>${b.subtitle ? `<p class="sub">${esc(b.subtitle)}</p>` : ""}
        <dl class="meta"><dt>저자</dt><dd>${esc(b.authors.join(", "))}</dd><dt>출판사</dt><dd>${esc(b.publisher)}</dd>
          <dt>출간일</dt><dd>${esc(b.published.replaceAll("-", ". "))}</dd><dt>ISBN</dt><dd>${b.isbn}</dd>
          <dt>상태</dt><dd>${b.out_of_print ? '<span class="badge">절판</span>' : '<span class="badge">판매 중</span>'}</dd></dl>
        <div class="actions"><a class="btn" href="${esc(b.url)}" target="_blank" rel="noopener">알라딘에서 보기 ↗</a>
          <button class="btn ghost" data-copy>링크 복사</button></div>
        ${neighbors.length ? `<div class="neighbors"><h4>같은 선반의 책</h4><div class="list">${neighbors.map(bookEl).join("")}</div></div>` : ""}
      </div>`;
    document.body.append(scrim, sheet);
    document.body.style.overflow = "hidden";
    current = { scrim, sheet, b };
    history.replaceState(null, "", "#b-" + b.isbn);

    const bigImg = $(".big img", sheet), hero = $(".hero", sheet);
    const applyTint = () => { const t = tintCache.get(b.isbn) ?? tintOf(bigImg); if (t) { tintCache.set(b.isbn, t); hero.style.setProperty("--tint", t); } };
    if (bigImg) bigImg.complete ? applyTint() : bigImg.addEventListener("load", applyTint, { once: true });
    else hero.style.setProperty("--tint", `hsl(${hue(b.title)} 30% 34%)`);

    // 선반에서 날아오르는 표지
    const srcCover = fromEl && $(".c", fromEl);
    const big = $(".big", sheet);
    if (srcCover && !reduce && b.cover) {
      const from = srcCover.getBoundingClientRect();
      big.style.visibility = "hidden";
      requestAnimationFrame(() => {
        const to = big.getBoundingClientRect();
        const fly = Object.assign(document.createElement("div"), { className: "flyer" });
        fly.innerHTML = `<img src="${esc(small(b.cover))}" alt="">`;
        Object.assign(fly.style, { left: from.left + "px", top: from.top + "px", width: from.width + "px", height: from.height + "px" });
        document.body.append(fly);
        srcCover.style.opacity = "0";
        requestAnimationFrame(() => Object.assign(fly.style, { left: to.left + "px", top: to.top + "px", width: to.width + "px", height: to.height + "px" }));
        setTimeout(() => { big.style.visibility = ""; fly.remove(); srcCover.style.opacity = ""; }, 440);
      });
    }
    requestAnimationFrame(() => { scrim.classList.add("on"); sheet.classList.add("on"); });
    $(".close", sheet).focus({ preventScroll: true });

    scrim.addEventListener("click", () => closeBook());
    $(".close", sheet).addEventListener("click", () => closeBook());
    $("[data-copy]", sheet).addEventListener("click", async (e) => {
      const url = location.href.split("#")[0] + "#b-" + b.isbn;
      try { await navigator.clipboard.writeText(url); e.target.textContent = "복사했어요"; } catch { e.target.textContent = url; }
    });
    $(".neighbors .list", sheet)?.addEventListener("click", (e) => {
      const nb = e.target.closest(".book"); if (!nb) return; e.stopPropagation(); openBook(byIsbn.get(nb.dataset.isbn), null);
    });
  }
  function closeBook(instant) {
    if (!current) return;
    const { scrim, sheet } = current; current = null;
    document.body.style.overflow = "";
    if (location.hash.startsWith("#b-")) history.replaceState(null, "", location.pathname + location.search);
    if (instant || reduce) { scrim.remove(); sheet.remove(); }
    else { scrim.classList.remove("on"); sheet.classList.remove("on"); setTimeout(() => { scrim.remove(); sheet.remove(); }, 300); }
    if (!instant && lastFocus?.isConnected) lastFocus.focus({ preventScroll: true });
  }
  addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeBook();
    if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
  });

  render();
  const deep = location.hash.match(/^#b-(\d{13})$/);
  if (deep) openBook(byIsbn.get(deep[1]), document.querySelector(`.book[data-isbn="${deep[1]}"]`));
})();
</script>
</body>
</html>
